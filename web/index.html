<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="பண்டாரத்தார் மண மாலை - Pandarathar Matrimony">



  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pandarathar Matrimony">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>பண்டாரத்தார் மண மாலை - Pandarathar Matrimony</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1E0E14;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #3B1822 0%, #1E0E14 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .brand-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #7A132B;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 18px;
      border: 2px solid #D4AF37;
    }
    .brand-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .brand-sub {
      color: #D4AF37;
      font-size: 13px;
      font-weight: 500;
      margin: 0 0 24px 0;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      margin-top: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
    <div class="brand-title">பண்டாரத்தார் மண மாலை</div>
    <div class="brand-sub">Pandarathar Matrimony</div>
    <div class="spinner"></div>
    <div class="loading-text">ஏற்றுகிறது... தயவுசெய்து காத்திருக்கவும்</div>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loading-container');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    // Fallback: observe DOM additions of Flutter elements
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(hideLoader, 200);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
